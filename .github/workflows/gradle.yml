# CI Workflow — delegates to mbl-actionhub reusable CI workflow
#
# Triggers:
#   - push to development or main (full build — all modules always verified)
#   - workflow_call (invoked by publish.yml before every Maven publish)
#
# PRs are handled separately by pr-check.yml (fast gate, changed modules only).

name: CI

on:
  push:
    branches: [ "development", "main" ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/ci-kmp-library.yml@v1.6.1
    with:
      module-pattern: 'cmp-'
      java-version: '21'
      java-distribution: 'zulu'
      run-quality: true
      # run-ios-tests / run-linux-tests: false (fast gate)
      # Push to development/main always runs all modules (detect-changes build_all=true)
      # Add run-ios-tests: true on release branches or nightly scheduled runs
