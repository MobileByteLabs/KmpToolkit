# CI Workflow — delegates to mbl-actionhub reusable CI workflow
#
# Triggers:
#   - push to development or main
#   - pull_request targeting development or main
#   - workflow_call (invoked by publish.yml before every Maven publish)

name: CI

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "development", "main" ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/ci-kmp-library.yml@v1.0.4
    with:
      module-pattern: 'cmp-'
      java-version: '21'
      java-distribution: 'zulu'
      run-ios-tests: true
      run-linux-tests: true
      run-quality: true
