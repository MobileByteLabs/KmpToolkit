# Native test execution — iOS + watchOS Simulator, Windows Native, Linux Native.
#
# WHY THIS EXISTS
# `pr-check.yml` sets run-ios-tests/run-linux-tests to false: executing them on every PR costs
# a macOS runner for up to 45 minutes, and compile-all-targets already catches missing
# actuals and type errors on every platform. That trade is deliberate and stays.
#
# The gap it leaves is real, though. `commonTest` runs on native targets too, and a test can be
# wrong there while passing on JVM/JS — which is exactly what happened: an assertion in
# AnalyticsProviderContractTest generalized JVM/JS behaviour to Apple (`Firebase.analytics`
# throws for an uninitialized app on JS/wasmJs, but NOT on Apple) and shipped green in 3.5.23
# because no Apple test ever ran. This workflow closes that gap without taxing every PR.
#
# WHY IT DOES NOT CALL ci-kmp-library.yml
# That reusable workflow gates its native jobs on `detect-changes`, which for a non-PR event
# diffs against `origin/${{ github.base_ref || 'development' }}`. This repo's default branch is
# `dev`, so that ref does not exist, detection falls back to HEAD~1, and any night whose last
# commit touched no cmp-* module yields `modules=NONE` — the native jobs skip and the run
# reports green having executed nothing. Calling the gradle tasks directly avoids depending on
# change detection for a job whose entire purpose is to always run.
#
# WHY EVERY JOB GOES THROUGH run-native-tests.sh
# A root-level `./gradlew <target>Test` runs the task in every project declaring the target, which
# for the Apple targets includes the 11 sample Compose apps. That was 46% of the iOS job's task
# graph and is what pushed it into its 45-minute timeout (run 34639024914) — spent linking sample
# apps and resolving their SwiftPM packages to execute five `assertEquals(3, 1 + 2)` cases. The
# script scopes each run to the cmp-* library modules; the full rationale and the measurements are
# in its header.
name: Native Tests

on:
  schedule:
    # 03:00 UTC daily — after the working day, before the next one.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which native targets to run'
        required: false
        default: 'all'
        type: choice
        # Was [both, ios, linux] — "both" predated the watchOS and Windows jobs and had stopped
        # describing reality. On a pull_request event this input is empty, which every condition
        # below treats as "all".
        options: [all, ios, watchos, linux, windows]
  pull_request:
    # Opt-in per PR: add the `native-tests` label to run these before merging something
    # that touches native behaviour.
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Test (iOS Simulator)
    # On PRs, only when explicitly labeled. Schedule/dispatch always run.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'native-tests')
    # macos-latest, not macos-14: the macos-14 image ships an Xcode whose Swift toolchain is older
    # than firebase-ios-sdk 12.x requires, so SwiftPM resolution fails before any test runs with
    # "Dependencies could not be resolved because 'firebase-ios-sdk' >= 12.0.0 contains
    # incompatible tools version (6.1.0)". That aborted the whole build at
    # :cmp-app-intents:fetchUmbrellaPackageIdentifierForDefault — nothing to do with the tests.
    runs-on: ${{ vars.CI_RUNNER_MAC || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
      - uses: gradle/actions/setup-gradle@v6

      - name: Run iosSimulatorArm64Test
        if: inputs.targets == '' || inputs.targets == 'all' || inputs.targets == 'ios'
        run: bash .github/scripts/run-native-tests.sh iosSimulatorArm64Test --continue

      - name: Assert tests actually executed
        # A test task can report success having run nothing (no test sources wired, a filter
        # that matches zero cases, a target that silently no-ops). Silence must not read as
        # success — this is the whole point of the workflow.
        if: always() && (inputs.targets == '' || inputs.targets == 'all' || inputs.targets == 'ios')
        run: bash .github/scripts/assert-tests-ran.sh iosSimulatorArm64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-reports-ios
          path: '**/build/test-results/iosSimulatorArm64Test/**/*.xml'
          if-no-files-found: warn

  watchos:
    name: Test (watchOS Simulator)
    # cmp-share is the only module with watchOS targets today. Runs here rather than in
    # pr-check because a local macOS dev box usually has NO watchOS simulator runtime installed
    # (`xcrun simctl list runtimes` shows none), which makes `watchosSimulatorArm64Test` fail with
    # "Xcode does not support simulator tests for watchos_simulator_arm64" — a missing SDK, not a
    # broken build. The GitHub macOS image ships the runtime, so this is where the watchOS
    # `actual`s actually get EXECUTED instead of only compiled.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'native-tests')
    # macos-latest, not macos-14: the macos-14 image ships an Xcode whose Swift toolchain is older
    # than firebase-ios-sdk 12.x requires, so SwiftPM resolution fails before any test runs with
    # "Dependencies could not be resolved because 'firebase-ios-sdk' >= 12.0.0 contains
    # incompatible tools version (6.1.0)". That aborted the whole build at
    # :cmp-app-intents:fetchUmbrellaPackageIdentifierForDefault — nothing to do with the tests.
    runs-on: ${{ vars.CI_RUNNER_MAC || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
      - uses: gradle/actions/setup-gradle@v6

      - name: Show available watchOS runtimes
        # Printed before the run so a failure is immediately attributable to a missing runtime
        # on the image rather than to the code under test.
        run: xcrun simctl list runtimes | grep -i watch || echo "NO watchOS runtime on this image"

      - name: Run watchosSimulatorArm64Test
        if: inputs.targets == '' || inputs.targets == 'all' || inputs.targets == 'watchos'
        run: bash .github/scripts/run-native-tests.sh watchosSimulatorArm64Test --continue

      - name: Assert tests actually executed
        if: always() && (inputs.targets == '' || inputs.targets == 'all' || inputs.targets == 'watchos')
        run: bash .github/scripts/assert-tests-ran.sh watchosSimulatorArm64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-reports-watchos
          path: '**/build/test-results/watchosSimulatorArm64Test/**/*.xml'
          if-no-files-found: warn

  windows:
    name: Test (Windows Native)
    # The LAST unexecuted platform. Every Windows path in this toolkit — the PowerShell
    # OpenFileDialog/SaveFileDialog in cmp-intent-launcher, the NotifyIcon balloon in cmp-bubble,
    # the clipboard fallbacks in cmp-share — has only ever been compile- and link-verified. None
    # of it has run, so none of the PowerShell quoting has been proven against a real shell.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'native-tests')
    runs-on: ${{ vars.CI_RUNNER_WINDOWS || 'windows-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
      - uses: gradle/actions/setup-gradle@v6

      - name: Show PowerShell version
        # Printed first so a failure is immediately attributable to the shell rather than to the
        # code under test — the same reason the watchOS job prints its simulator runtimes.
        #
        # `shell: pwsh` rather than `run: powershell -Command "$PSVersionTable..."`: the runner's
        # DEFAULT shell on Windows is already PowerShell, so the outer shell expanded
        # $PSVersionTable before the inner one ever saw it, and the step failed with
        # CommandNotFoundException — taking the whole job with it.
        shell: pwsh
        run: $PSVersionTable.PSVersion

      - name: Run mingwX64Test
        if: inputs.targets == '' || inputs.targets == 'all' || inputs.targets == 'windows'
        # bash, not the default pwsh: `./gradlew` is the POSIX launcher script. Windows runners
        # ship git-bash, so this runs the same wrapper every other job uses rather than needing
        # gradlew.bat.
        shell: bash
        run: bash .github/scripts/run-native-tests.sh mingwX64Test --continue

      - name: Assert tests actually executed
        if: always() && (inputs.targets == '' || inputs.targets == 'all' || inputs.targets == 'windows')
        run: bash .github/scripts/assert-tests-ran.sh mingwX64Test
        shell: bash

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-reports-windows
          path: '**/build/test-results/mingwX64Test/**/*.xml'
          if-no-files-found: warn

  linux:
    name: Test (Linux Native)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'native-tests')
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-26.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
      - uses: gradle/actions/setup-gradle@v6

      - name: Run linuxX64Test
        if: inputs.targets == '' || inputs.targets == 'all' || inputs.targets == 'linux'
        run: bash .github/scripts/run-native-tests.sh linuxX64Test --continue

      - name: Assert tests actually executed
        if: always() && (inputs.targets == '' || inputs.targets == 'all' || inputs.targets == 'linux')
        run: bash .github/scripts/assert-tests-ran.sh linuxX64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-reports-linux
          path: '**/build/test-results/linuxX64Test/**/*.xml'
          if-no-files-found: warn
