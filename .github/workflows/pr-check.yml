# PR Check Workflow — fast gate on pull requests
# Runs quality + JVM + Linux tests on changed modules only (iOS skipped for speed)

name: PR Check

on:
  pull_request:
    branches: [ "development", "main" ]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/pr-check-kmp.yml@v1.0.1
    with:
      module-pattern: 'cmp-'
      java-version: '21'
      java-distribution: 'zulu'
      run-ios-tests: false
      run-linux-tests: true
