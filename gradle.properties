# =============================================================================
# KmpToolkit — Single version source of truth
# Bump this ONE value to release all modules together.
# Current: 3.2.2 (cmp-bubble only on Maven Central; one-off escape publish).
# Next toolkit-wide patch: 3.2.3 | Next minor: 3.3.0 | Next major: 4.0.0
# =============================================================================
kmptoolkit.version=3.2.3

# Maven Central Publishing (vanniktech 0.36.0 reads these from gradle.properties)
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=true

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.enableCInteropCommonization=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Compose Multiplatform
org.jetbrains.compose.experimental.macos.enabled=true
